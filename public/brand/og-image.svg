<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <rect width="1200" height="630" fill="#111111" />
  <!-- Grid overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Outer border frame -->
  <rect x="40" y="40" width="1120" height="550" stroke="#333333" stroke-width="2" fill="none" />
  <rect x="48" y="48" width="1104" height="534" stroke="#222222" stroke-width="1" fill="none" />
  
  <!-- Top header mock bar -->
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#333333" stroke-width="2" />
  <rect x="70" y="65" width="12" height="12" fill="#FFFFFF" />
  <rect x="92" y="65" width="12" height="12" fill="#555555" />
  <rect x="114" y="65" width="12" height="12" fill="#333333" />
  <text x="150" y="75" fill="#777777" font-family="monospace" font-size="14">YOURWEBPAGE.CA // PRODUCTION READY ARCHITECTURE</text>
  
  <!-- Content -->
  <g transform="translate(100, 180)">
    <!-- Logo Mark -->
    <rect x="0" y="0" width="80" height="80" stroke="#FFFFFF" stroke-width="4" fill="none" />
    <line x1="0" y1="24" x2="80" y2="24" stroke="#FFFFFF" stroke-width="3" />
    <rect x="12" y="10" width="6" height="6" fill="#FFFFFF" />
    <rect x="24" y="10" width="6" height="6" fill="#FFFFFF" />
    <rect x="36" y="10" width="6" height="6" fill="#FFFFFF" />
    <rect x="14" y="36" width="22" height="30" stroke="#FFFFFF" stroke-width="3" fill="none" />
    <line x1="14" y1="48" x2="36" y2="48" stroke="#FFFFFF" stroke-width="3" />
    <rect x="44" y="36" width="22" height="18" stroke="#FFFFFF" stroke-width="3" fill="none" />
    <line x1="44" y1="54" x2="44" y2="66" stroke="#FFFFFF" stroke-width="3" />
    
    <text x="110" y="45" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">YOUR WEB PAGE</text>
    <text x="112" y="72" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="0.15em">NIGHTTECH SERVICE INC.</text>
    
    <text x="0" y="170" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.02em">
      Your website should make business easier.
    </text>
    <text x="0" y="230" fill="#AAAAAA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="400">
      Web Design &amp; Development • Shared Cloud Hosting &amp; Dedicated VMs • CMS • Maintenance
    </text>
    
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="240" height="52" fill="#FFFFFF" />
      <text x="24" y="33" fill="#111111" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">Request a Quote</text>
      <text x="270" y="33" fill="#888888" font-family="monospace" font-size="15">Charlottetown, PE • Atlantic Canada</text>
    </g>
  </g>
</svg>
