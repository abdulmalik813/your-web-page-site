<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer precision geometric frame -->
  <rect x="3" y="3" width="42" height="42" stroke="currentColor" stroke-width="2.5" fill="none" />
  <!-- Browser / Page Header Bar dividing rule -->
  <line x1="3" y1="14" x2="45" y2="14" stroke="currentColor" stroke-width="2" />
  <!-- Window dot indicators (sharp square dots for boxy theme) -->
  <rect x="8" y="7" width="3" height="3" fill="currentColor" />
  <rect x="14" y="7" width="3" height="3" fill="currentColor" />
  <rect x="20" y="7" width="3" height="3" fill="currentColor" />
  <!-- Central geometric monogram / page layout mark representing Y and P structure -->
  <rect x="10" y="20" width="12" height="18" stroke="currentColor" stroke-width="2" fill="none" />
  <line x1="10" y1="28" x2="22" y2="28" stroke="currentColor" stroke-width="2" />
  <rect x="26" y="20" width="12" height="10" stroke="currentColor" stroke-width="2" fill="none" />
  <line x1="26" y1="30" x2="26" y2="38" stroke="currentColor" stroke-width="2" />
</svg>
