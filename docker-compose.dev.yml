services:
  mongodb:
    image: mongo:7.0
    container_name: dev-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: payload
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  silo:
    image: pgsty/silo:latest
    container_name: dev-silo-s3
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - silo_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Automatically initializes the default media bucket in Silo on startup
  create-bucket:
    image: pgsty/mc:latest
    container_name: dev-silo-mc
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set silo http://silo:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing silo/your-web-page-site;
      /usr/bin/mc anonymous set download silo/your-web-page-site;
      exit 0;
      "

volumes:
  mongodb_data:
    driver: local
  silo_data:
    driver: local
